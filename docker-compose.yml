services:
  postgres:
    image: postgres:16
    container_name: pg_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    networks:
      - pipeline_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pg_admin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pipeline_net

  ingest:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    container_name: ingest
    # Keep ingestion out of the default `docker compose up` startup.
    profiles: ["ingest"]
    env_file: .env
    environment:
      # Use the Compose service name to reach PostgreSQL, not localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RAW_DIR: /data/raw
    # Persist downloaded raw data in the repository's data/raw directory.
    volumes:
      - ./data/raw:/data/raw
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pipeline_net
    restart: "no"

volumes:
  pgdata:
  pgadmin_data:

networks:
  pipeline_net:
